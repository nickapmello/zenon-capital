<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenon Capital — Arquitetura de Capital</title>
  <meta name="description" content="Mais do que soluções, direção. Realizamos a Arquitetura de Capital das empresas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <!-- Camada de Ruído Tátil Global (Noise Overlay) -->
  <div class="noise-overlay" aria-hidden="true"></div>

  <!-- Etapa 2: Fundo Completo & Atmosfera Isolada (sem navbar, sem cards, sem textos) -->
  <main>
    <!-- 1. Hero / Abertura: Oceano & Veleiro com Iluminação Lateral -->
    <section class="stage-hero" id="stage-hero" aria-label="Fundo Abertura"></section>

    <!-- 2. Quem é a Zenon: Fundo Creme Editorial -->
    <section class="stage-quem-e" id="stage-quem-e" aria-label="Fundo Quem é a Zenon"></section>

    <!-- 3. Arquitetura de Capital: Azul Profundo Marinho -->
    <section class="stage-arquitetura" id="stage-arquitetura" aria-label="Fundo Arquitetura de Capital"></section>

    <!-- 4. Para quem é: Areia Suave -->
    <section class="stage-para-quem-e" id="stage-para-quem-e" aria-label="Fundo Para quem é"></section>

    <!-- 5. Frentes de Atuação: Gradiente Terracota / Cobre / Luz Bronze -->
    <section class="stage-frentes" id="stage-frentes" aria-label="Fundo Frentes de Atuação"></section>

    <!-- 6. Diagnóstico: Oceano Noturno com Rastro d'Água -->
    <section class="stage-diagnostico" id="stage-diagnostico" aria-label="Fundo Diagnóstico"></section>

    <!-- 7. Fusões e Aquisições: Grafite Escuro Neutro -->
    <section class="stage-fusoes" id="stage-fusoes" aria-label="Fundo Fusões e Aquisições"></section>

    <!-- 8. Nosso Princípio: Terracota Nobre Sólido -->
    <section class="stage-principio" id="stage-principio" aria-label="Fundo Nosso Princípio"></section>

    <!-- 9. Por que a Zenon: Oceano com Reflexo Solar no Topo -->
    <section class="stage-por-que" id="stage-por-que" aria-label="Fundo Por que a Zenon"></section>

    <!-- 10. Contato: Creme Editorial -->
    <section class="stage-contato" id="stage-contato" aria-label="Fundo Contato"></section>

    <!-- 11. Rodapé: Azul Noturno Profundo -->
    <footer class="stage-rodape" id="stage-rodape" aria-label="Fundo Rodapé"></footer>
  </main>
</body>
</html>
